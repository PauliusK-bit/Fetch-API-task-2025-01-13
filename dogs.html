<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="dogs.css" />
  </head>
  <body>
    <form id="dogs">
      <div class="form-control">
        <label class="focus-in-contract" for="category"
          >Choose a dog breed</label

      <button class="btn" type="submit">
        Get picture by choosing a dog breed
      </button>
    </form>
    <div id="picture"></div>

    <script src="dogs.js"></script>
  </body>
</html>
